name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: estacao/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r estacao/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall estacao tests
