name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: estacao/requirements.txt
      - run: python -m pip install --upgrade 'pip>=26.2.0'
      - run: python -m pip install -r estacao/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall estacao tests
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tests/test_form_guard.js
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade 'pip>=26.2.0' pip-audit
      - run: python -m pip_audit -r estacao/requirements.txt --strict
